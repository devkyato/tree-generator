name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "version = \"$VERSION\"" wally.toml
          grep -F "GenTree.Version = \"$VERSION\"" src/init.lua
      - name: Install release tools
        run: |
          cargo install rojo --version 7.7.0 --locked
          cargo install wally --version 0.3.2 --locked
      - name: Build release artifacts
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          rojo build package.project.json --output "dist/GenTree-${VERSION}.rbxm"
          wally package --output "dist/gentree-${VERSION}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
      - name: Publish to Wally
        if: ${{ env.WALLY_AUTH_TOKEN != '' }}
        run: wally publish --token "$WALLY_AUTH_TOKEN"
