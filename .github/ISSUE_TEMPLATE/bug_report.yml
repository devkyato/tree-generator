name: Bug report
description: Tell me about GenTree behavior you can reproduce.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Please include the GenTree version and the smallest script that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect GenTree to build or return instead?
    validations:
      required: true
